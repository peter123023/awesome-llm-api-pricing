name: sync

on:
  schedule:
    - cron: '0 1 * * *'   # 每日 UTC 01:00（北京 09:00）重建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run sync
      - run: npm run build
        env:
          REPO: ${{ github.repository }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md README.en.md data/items.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.en.md data/items.csv
            git commit -m "chore: rebuild README from data [skip ci]"
            git push
          else
            echo "No changes."
          fi
